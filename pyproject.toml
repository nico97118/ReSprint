[project]
name = "resprint"
version = "1.3.0.dev"
description = "Prepare Jira sprint reviews by highlighting unfinished issues with Tempo time spent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "flask>=3.0.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tomli>=2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = ["integration: local HTTP services and installed CLI subprocesses"]

[tool.coverage.run]
source = ["resprint"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 97

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[project.optional-dependencies]
server = ["gunicorn>=27.0.1"]

[project.scripts]
resprint = "resprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
