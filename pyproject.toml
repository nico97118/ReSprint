[project]
name = "sprint-review"
version = "0.1.0"
description = "Prepare Jira sprint reviews by highlighting unfinished issues with Tempo time spent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[project.scripts]
sprint-review = "sprint_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
