[project]
name = "resprint"
version = "1.0.0b1"
description = "Prepare Jira sprint reviews by highlighting unfinished issues with Tempo time spent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "flask>=3.0.0",
    "jinja2>=3.1.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[project.scripts]
resprint = "resprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
