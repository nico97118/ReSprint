<section class="kpi-section" aria-labelledby="kpi-title">
  <div class="kpi-section-header">
    <h2 id="kpi-title">KPI</h2>
  </div>
  <div class="kpi-groups">
    {% for group in groups %}
      <details class="kpi-group" {% if group.expanded %}open{% endif %}>
        <summary class="kpi-group-summary">
          <span class="kpi-group-title">{{ group.title }}</span>
          <span class="mdi mdi-chevron-down kpi-group-icon" aria-hidden="true"></span>
        </summary>
        <div class="kpi-group-content">
          {% if group.summary_html %}
            {{ group.summary_html | safe }}
          {% endif %}
          <div class="kpi-grid kpi-grid-{{ group.blocks | length }}">
            {% for block in group.blocks %}
              <article class="kpi-card {% if block.wide %}kpi-card-wide{% endif %}">
                <h4 class="kpi-card-title">{{ block.title }}</h4>
                {{ block.html | safe }}
              </article>
            {% endfor %}
          </div>
        </div>
      </details>
    {% endfor %}
  </div>
</section>
