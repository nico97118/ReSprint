<form method="get" action="/report" data-report-generation-form>
  <input type="hidden" name="board_id" value="{{ board_id }}">
  <input type="hidden" name="sprint_id" value="{{ sprint_id }}">
  {% if tempo_team_id is not none %}
    <input type="hidden" name="tempo_team_id" value="{{ tempo_team_id }}">
  {% endif %}
  <button type="submit" data-loading-label="{{ t('home.generating') }}">
    <span class="button-content">
      <span class="mdi mdi-file-chart-outline" aria-hidden="true"></span>
      <span>{{ t('home.generate') }}</span>
    </span>
  </button>
</form>
