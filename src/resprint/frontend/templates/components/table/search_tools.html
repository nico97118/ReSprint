<div class="search-wrap">
  <span class="mdi mdi-magnify" aria-hidden="true"></span>
  <input
    class="search"
    type="search"
    aria-label="{{ t('table.search_in', title=title) }}"
    placeholder="{{ t('table.search_placeholder') }}"
    data-table-search
  >
  {% if include_count %}
    <span class="row-count" data-row-count></span>
  {% endif %}
</div>
