{% if not sortable -%}
<th{{ header_attributes | safe }}{{ label_attributes | safe }}>
  <span class="column-heading">
    <span>{{ label }}</span>
    {{ total_html | safe }}
  </span>
</th>
{%- else -%}
<th{{ header_attributes | safe }}{{ label_attributes | safe }} data-sortable aria-sort="{{ aria_sort }}">
    <button
      class="sort-button"
      type="button"
      data-sort-column="{{ column_index }}"
      data-sort-type="{{ sort_type }}"
      data-sort-direction="{{ sort_direction }}"
    >
      <span class="column-heading">
        <span>{{ label }}</span>
        {{ total_html | safe }}
      </span>
      <span class="{{ indicator_class }}" aria-hidden="true"></span>
    </button>
</th>
{%- endif %}
