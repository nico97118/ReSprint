<div class="time-ratio">
  <div class="time-ratio-header">
    <span class="muted">{{ t('report.time_ratio_label') }}</span>
    <strong>{{ total_time }}</strong>
  </div>
  <div class="time-ratio-chart-frame">
    {{ chart_html | safe }}
  </div>
  <div class="time-ratio-legend">
    {% for segment in segments %}
      <span class="time-ratio-legend-item">
        <span class="time-ratio-dot time-ratio-dot-{{ segment.variant }}"></span>
        <span>{{ segment.label }}</span>
        <strong>{{ segment.duration }}</strong>
        <span class="muted">{{ segment.percentage }}%</span>
      </span>
    {% endfor %}
  </div>
</div>
