<div class="time-progress">
  <div class="time-progress-row">
    <div class="time-progress-label">{{ t('report.original_estimated_short') }}</div>
    <div class="time-progress-track" aria-label="{{ t('report.original_estimate') }}">
      <div
        class="time-progress-segment time-progress-segment-original"
        style="width: {{ original_width }}%"
        title="{{ t('report.original_estimated_short') }}: {{ original_duration }}"
      ></div>
    </div>
    <div class="time-progress-value">{{ original_duration }}</div>
  </div>
  <div class="time-progress-row">
    <div class="time-progress-label">{{ t('report.current_projection') }}</div>
    <div class="time-progress-track" aria-label="{{ t('report.current_projection') }}">
      <div
        class="time-progress-segment time-progress-segment-spent-before"
        style="width: {{ spent_before_width }}%"
        title="{{ t('report.spent_before') }}: {{ spent_before_duration }}"
      ></div>
      <div
        class="time-progress-segment time-progress-segment-spent-sprint"
        style="width: {{ sprint_width }}%"
        title="{{ t('report.spent_during_sprint') }}: {{ sprint_duration }}"
      ></div>
      <div
        class="time-progress-segment time-progress-segment-remaining"
        style="width: {{ remaining_width }}%"
        title="{{ t('report.remaining_estimation') }}: {{ remaining_duration }}"
      ></div>
    </div>
    <div class="time-progress-value">{{ projection_duration }}</div>
  </div>
  <div class="time-progress-legend">
    {{ legend_html | safe }}
  </div>
</div>
