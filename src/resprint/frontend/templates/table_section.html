<section{{ attributes | safe }}>
  <div class="section-header">
    <h2>{{ title }} <span class="muted">({{ row_count }})</span></h2>
    {{ search_tools | safe }}
  </div>
  <div class="table-wrap">
    <table{{ table_attributes | safe }}>
      <thead>
        <tr>
          {{ headers | safe }}
        </tr>
      </thead>
      <tbody>
        {{ body_rows | safe }}
      </tbody>
    </table>
    <div class="no-results" id="{{ empty_id }}" data-no-results>
      {{ empty_message }}
    </div>
  </div>
</section>
