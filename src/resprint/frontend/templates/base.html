<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
  >
  <style>
    {{ common_css | safe }}
    main { max-width: {{ max_width }}; }
    .page-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .page-header h1 { margin: 0; }
    .page-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .page-footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    {{ extra_css | safe }}
  </style>
  <script>
    {{ theme_script | safe }}
  </script>
  {{ vendor_scripts | safe }}
</head>
<body>
  <nav class="app-navbar" aria-label="Navigation principale">
    <a class="app-brand" href="/">
      <span class="mdi mdi-run-fast" aria-hidden="true"></span>
      <span>ReSprint</span>
    </a>
    <div class="app-navbar-actions">
      <button
        class="theme-switch"
        type="button"
        aria-label="Changer le theme"
        role="switch"
        aria-checked="false"
        data-theme-toggle
      >
        <span class="theme-switch-thumb">
          <span class="mdi mdi-weather-sunny" aria-hidden="true" data-theme-icon></span>
        </span>
      </button>
    </div>
  </nav>
  <main>
    <header class="page-header">
      <h1>{{ title }}</h1>
      {% if header_actions %}
        <div class="page-header-actions">
          {{ header_actions | safe }}
        </div>
      {% endif %}
    </header>
    {{ content | safe }}
    <footer class="page-footer">ReSprint</footer>
  </main>
  <script>
    {{ scripts | safe }}
  </script>
</body>
</html>
