<div class="sprint-time-kpi">
  <div class="kpi-main-value">{{ total_time }}</div>
  <div class="muted">{{ total_label }}</div>

  <div class="issue-type-time-list">
    {% if issue_type_times %}
      {% for item in issue_type_times %}
        <div class="issue-type-time-row">
          <span>{{ item.issue_type }}</span>
          <strong>{{ item.duration }}</strong>
        </div>
      {% endfor %}
    {% else %}
      <div class="muted">{{ empty_message }}</div>
    {% endif %}
  </div>
</div>
