<div class="issue-change">
  <span class="issue-change-meta">{{ created }} - {{ author }}</span>
  <span class="issue-change-field">{{ field }}</span>
  <span class="issue-change-value">{{ from_value }}</span>
  <span class="mdi mdi-arrow-right-thin issue-change-arrow" aria-hidden="true"></span>
  <span class="issue-change-value issue-change-value-new">{{ to_value }}</span>
</div>
