<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ mdi_stylesheet_url }}">
  {% for stylesheet in stylesheets %}
    <link rel="stylesheet" href="{{ stylesheet }}">
  {% endfor %}
  {% for script in head_scripts %}
    <script src="{{ script }}"></script>
  {% endfor %}
</head>
<body>
  <nav class="app-navbar" aria-label="Navigation principale">
    <a class="app-brand" href="/">
      <span class="mdi mdi-run-fast" aria-hidden="true"></span>
      <span>ReSprint</span>
    </a>
    <div class="app-navbar-actions">
      <button
        class="theme-switch"
        type="button"
        aria-label="Changer le theme"
        role="switch"
        aria-checked="false"
        data-theme-toggle
      >
        <span class="theme-switch-thumb">
          <span class="mdi mdi-weather-sunny" aria-hidden="true" data-theme-icon></span>
        </span>
      </button>
    </div>
  </nav>
  <main>
    <header class="page-header">
      <h1>{{ title }}</h1>
      {% if header_actions %}
        <div class="page-header-actions">
          {{ header_actions | safe }}
        </div>
      {% endif %}
    </header>
    {{ content | safe }}
    <footer class="page-footer">ReSprint {{ app_version }}</footer>
  </main>
  {% for script in scripts %}
    <script src="{{ script }}"></script>
  {% endfor %}
</body>
</html>
