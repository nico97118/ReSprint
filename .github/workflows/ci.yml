name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and frontend assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run minify:check
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --dev --locked
      - run: uv run --locked ruff format --check
      - run: uv run --locked ruff check

  python:
    name: Python ${{ matrix.python }} tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A few Python tests execute the frontend duration formatter in Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --locked --python ${{ matrix.python }}
      - name: Test with branch coverage
        run: uv run --python ${{ matrix.python }} --locked pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=test-results/pytest.xml
      - name: Preserve coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-reports-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
            test-results/pytest.xml
          retention-days: 14

  browser:
    name: Playwright GUI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --dev --locked
      - run: npm ci
      - run: npm run minify:check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Preserve browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --tag resprint:ci .
      - run: bash scripts/docker-smoke.sh resprint:ci
