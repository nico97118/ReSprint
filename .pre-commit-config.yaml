repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false

      - id: minified-assets
        name: check minified frontend assets
        entry: npm run minify:check
        language: system
        pass_filenames: false
        files: ^(src/resprint/frontend/static/(?!min/).*\.(css|js)|scripts/minify-assets\.mjs|package\.json)$

      - id: forbid-env-file
        name: forbid .env commit
        entry: .env must not be committed
        language: fail
        files: ^\.env$
